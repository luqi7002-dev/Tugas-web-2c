<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas CSS 1</title>
    <!-- internal CSS -->
     <style>
        /*setiap elemen h2 memiliki warna biru font size 30px*/
        h2 {
            color: rgb(5, 5, 148);
            font-size: 30px;
        }
        /*setiap elemen class="judul" memiliki warna merah font size 50px*/
        .judul {
            color: red;
            font-size: 50px;
        }
     </style>
</head>
<body>
    <h1 class="judul">Nama saya luqi</h1>
    <!-- semua elemen h2 warnanya biru -->
    <h2>Alamat saya nganjuk</h2>
    <h2>umur saya 19 tahun</h2>
    <h2>hobi saya bermain game</h2>
    <p class="judul">lore ipsum dolor sit amet</p> 

</body>
</html>
